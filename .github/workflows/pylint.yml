name: Pylint

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: SecureNet-Analyzer-main
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: SecureNet-Analyzer-main/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pylint bandit pip-audit
      - name: Run automated verification
        run: python test_all.py
      - name: Compile Python sources
        run: python -m compileall -q Main.py Utils
      - name: Run Bandit security scan
        run: bandit -r Main.py Utils -ll
      - name: Audit dependencies
        run: pip-audit -r requirements.txt
      - name: Run Pylint
        run: pylint Main.py Utils --disable=missing-module-docstring,missing-function-docstring,missing-class-docstring,invalid-name,too-few-public-methods,broad-exception-caught,import-outside-toplevel,no-name-in-module,,line-too-long,too-many-branches,too-many-locals,too-many-return-statements,consider-using-with,unused-variable,unused-import,duplicate-code,no-else-break,too-many-statements,too-many-boolean-expressions,subprocess-run-check,bare-except,unspecified-encoding